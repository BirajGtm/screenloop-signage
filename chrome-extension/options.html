<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScreenLoop settings</title><link rel="stylesheet" href="ui.css"></head><body><header><img src="icons/48.png" width="48" height="48" alt=""><h1>All settings</h1></header><section class="row"><button id="manage">Manage pages</button><button id="demo">Play demo signage</button></section>
<form id="form"><label>Time per page<select id="seconds"><option value="30">30 seconds</option><option value="60">1 minute</option><option value="120">2 minutes</option><option value="300">5 minutes</option></select></label><label>Reload pages every<select id="reload"><option value="0">Off</option><option value="1">1 minute</option><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option></select></label><label>Timer accent color<input id="accent" type="color" value="#005bdb" style="width:80px;height:48px"></label><label><span><input id="timer" type="checkbox" style="width:auto"> Show countdown bar</span></label><label><span><input id="fade" type="checkbox" style="width:auto"> Fade on page switches</span></label><button class="primary" id="save" disabled>Save settings</button></form><p>Saving pauses playback. Automatic reload only runs while playing.</p><section><h2>On-screen controls and visuals</h2><p>Allow access to your playlist sites to show controls, the countdown bar, and transitions. Demo pages work without permission.</p><button id="access" disabled>Enable on-screen controls & visuals</button></section><p id="status" role="status"></p><script src="options.js"></script></body></html>
